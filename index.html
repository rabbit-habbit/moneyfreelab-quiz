const CATS=[["all","전체"],["A","큰 흐름"],["B","주식"],["C","부동산"]];
let cat="all", set=[], i=0, right=0, wrong=[];
const $=s=>document.querySelector(s), stage=$("#stage");
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function chips(){ $("#chips").innerHTML=CATS.map(([k,l])=>`<button class="chip" id="chip-${k}" aria-pressed="${k===cat}" data-k="${k}">${l}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cat=b.dataset.k;chips();start()}); }
function start(list){ const pool=list||DATA.filter(d=>cat==="all"||d.cat===cat); set=shuffle(pool).slice(0,15); i=0;right=0;wrong=[]; show(); }
function show(){
  const d=set[i], n=set.length;
  stage.innerHTML=`<div class="top"><span>${i+1} / ${n}</span><span>맞힌 문제 ${right}</span></div>
  <div class="bar"><i style="width:${i/n*100}%"></i></div>
  <div class="topic">${String(d.issue).padStart(2,"0")} ${d.title}</div>
  <p class="q">${d.q}</p>
  <div class="opts">${d.o.map((o,k)=>`<button class="opt" id="opt-${k}" data-k="${k}"><b>${"ABCD"[k]}</b><span>${o}</span></button>`).join("")}</div>
  <div id="fb"></div>`;
  stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
}
function pick(k){
  const d=set[i], ok=k===d.a; if(ok) right++; else wrong.push(d);
  stage.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true; if(j===d.a) b.classList.add("ok"); else if(j===k) b.classList.add("no");});
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"정답이에요! 👏":"아쉬워요, 정답은 "+"ABCD"[d.a]+"예요"}</b>${d.x?" "+d.x:""}<span class="pg">📖 정리본 ${d.page}쪽 · ${String(d.issue).padStart(2,"0")} ${d.title}</span></div>
  <button class="btn" id="next" style="margin-top:12px">${i+1<set.length?"다음 문제":"결과 보기"}</button>`;
  $("#next").onclick=()=>{i++; i<set.length?show():result()}; $("#next").focus();
}
function result(){
  const n=set.length, pct=right/n;
  const msg=pct>=.8?"이슈 고수예요! 기사가 술술 읽히겠어요 🎉":pct>=.5?"절반 넘게 맞혔어요. 이 정도면 충분해요 💚":"괜찮아요! 틀린 이슈만 정리본에서 다시 펴 보면 돼요 📖";
  const pages=[...new Map(wrong.map(w=>[w.issue,w])).values()].sort((a,b)=>a.issue-b.issue);
  stage.innerHTML=`<div class="top"><span>결과</span><span>${CATS.find(c=>c[0]===cat)[1]}</span></div>
  <div class="score">${right} / ${n}</div><p class="msg">${msg}</p>
  ${pages.length?`<div><div class="topic" style="margin-bottom:6px">다시 볼 것</div><div class="review">${pages.map(p=>`<div><span>${String(p.issue).padStart(2,"0")} ${p.title}</span><span>${p.page}쪽</span></div>`).join("")}</div></div>`:""}
  <div class="row">${wrong.length?`<button class="btn ghost" id="retry">틀린 것만 다시</button>`:""}<button class="btn" id="again">새로 15문제</button></div>`;
  if(wrong.length) $("#retry").onclick=()=>start(wrong.slice());
  $("#again").onclick=()=>start();
}
chips(); start();
